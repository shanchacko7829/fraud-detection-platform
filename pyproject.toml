[project]
name = "frauddetect"
version = "0.1.0"
description = "Real-time card fraud detection: point-in-time feature store, imbalance-aware model, explainable scoring API, drift monitoring"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.4", "joblib>=1.3",
  "matplotlib>=3.8", "starlette>=0.37", "uvicorn>=0.29", "pydantic>=2.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
